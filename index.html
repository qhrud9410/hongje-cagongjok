<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-title" content="홍제 운영실">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: one narrow operating column (max 720px), sticky store bar + tab strip, sheets slide up for every input. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D6DCD4;
  --ink:#1D2622; --ink-2:#56625C; --ink-3:#86918B;
  --accent:#2C5E4C; --accent-ink:#FFFFFF; --accent-soft:#DCE9E2;
  --good:#2F7D4F; --good-soft:#DDEFE3;
  --warn:#B26B12; --warn-soft:#F6E7CF;
  --bad:#B33A2E; --bad-soft:#F6DDD9;
  --off:#7B8580; --off-soft:#E6E9E6;
  --shadow:0 10px 30px rgba(20,35,28,.18);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-display:"Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --sunk:#222C27; --line:#2E3A34;
  --ink:#E7ECE9; --ink-2:#A9B4AE; --ink-3:#77837D;
  --accent:#7DBA9F; --accent-ink:#0F1A15; --accent-soft:#22362D;
  --good:#6CC08C; --good-soft:#1F3427; --warn:#E3A54F; --warn-soft:#3A2D1A;
  --bad:#EE8A7E; --bad-soft:#3D2420; --off:#8D9792; --off-soft:#262E2A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --sunk:#222C27; --line:#2E3A34;
  --ink:#E7ECE9; --ink-2:#A9B4AE; --ink-3:#77837D;
  --accent:#7DBA9F; --accent-ink:#0F1A15; --accent-soft:#22362D;
  --good:#6CC08C; --good-soft:#1F3427; --warn:#E3A54F; --warn-soft:#3A2D1A;
  --bad:#EE8A7E; --bad-soft:#3D2420; --off:#8D9792; --off-soft:#262E2A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand h1 small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-left:8px}
.who{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.clock{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3)}
nav.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px 11px;font-weight:600;font-size:14.5px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-family:var(--f-num);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
main{padding-top:18px;display:grid;gap:22px}
section{display:grid;gap:10px;min-width:0}
h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink-2)}
h2 .sub{font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{width:100%;justify-content:center;padding:16px;font-size:17px;border-radius:14px}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-good{color:var(--good);background:var(--good-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-bad{color:var(--bad);background:var(--bad-soft)}
.s-off{color:var(--off);background:var(--off-soft)}
.s-plan{color:var(--ink-2);background:var(--sunk)}
.s-accent{color:var(--accent);background:var(--accent-soft)}
/* today card */
.today{display:grid;gap:14px}
.today .date{font-size:13px;color:var(--ink-2)}
.today .who-big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.window{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.window .bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.window .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.stamp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stamp div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.stamp span{display:block;font-size:12px;color:var(--ink-3)}
.stamp b{font-family:var(--f-num);font-size:20px;font-weight:600}
.photo-thumb{width:100%;max-height:260px;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.choose{display:flex;flex-wrap:wrap;gap:8px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11.5px;color:var(--ink-3);text-align:center;padding:2px 0;font-weight:600}
.cal .dow.sun{color:var(--bad)}.cal .dow.sat{color:var(--accent)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:74px;padding:5px 5px 6px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;min-width:0}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.day .nm{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .tm{font-family:var(--f-num);font-size:11px}
.day .mark{height:4px;border-radius:2px;margin-top:auto}
.mk-accent{background:var(--accent)}.mk-good{background:var(--good)}.mk-warn{background:var(--warn)}.mk-bad{background:var(--bad)}.mk-off{background:var(--off)}.mk-plan{background:var(--line)}
.day .ev{font-size:10.5px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .ev.st{color:var(--good)}
.day .ev.eve{color:var(--ink-2);font-weight:500}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
.chk input:disabled{cursor:default}
.chk.done span.t{color:var(--ink-3)}
.chk .vid{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.chk .vid:hover{text-decoration:underline}
.chk .by{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);padding-top:2px}
.catlabel+.chk{border-top:0}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
details.cl summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.day .req{font-size:10.5px;color:var(--warn);font-weight:600}
/* supplies */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .nm{font-weight:600;min-width:0}
.item .meta{font-size:12.5px;color:var(--ink-3);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.catlabel{font-size:12px;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:12px 14px 4px;background:var(--sunk)}
.alert{display:flex;gap:10px;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.note{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--ink-3);font-weight:600;background:var(--sunk)}
td.r,th.r{text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:grid;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0;font-size:18px}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:40px;height:36px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
.days input{position:absolute;opacity:0;pointer-events:none}
.days input:checked+span{color:var(--accent)}
.days label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

[hidden]{display:none!important}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
.chk input:disabled{cursor:default}
.chk.done span.t{color:var(--ink-3)}
.chk .vid{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.chk .by{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);padding-top:2px}
.catlabel+.chk{border-top:0}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
details.cl summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.day .ev.eve.cov{color:var(--accent)}
header.bar{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
/* iPhone: 상태바 아래로 내용이 비치지 않게 머리줄 배경을 위로 늘림 */
header.bar::before{content:"";position:absolute;left:50%;transform:translateX(-50%);width:100vw;bottom:100%;height:100vh;background:var(--bg);pointer-events:none}

</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">
      <h1>카공족 홍제<small>운영실</small></h1>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="today" aria-selected="true">출근<span class="cnt" id="swapcnt" hidden></span></button>
      <button role="tab" data-tab="cal" aria-selected="false">근무 캘린더</button>
      <button role="tab" data-tab="sup" aria-selected="false">비품<span class="cnt" id="lowcnt" hidden></span></button>
      <button role="tab" data-tab="admin" aria-selected="false" id="admintab" hidden>관리</button>
    </nav>
  </header>
  <main id="main"><div class="empty"><b>불러오는 중</b>매장 기록을 가져오고 있어요.</div></main>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="sheetRoot"></div>
<script>window.addEventListener("error",function(e){var m=document.getElementById("main");if(m&&!m.querySelector(".card,section"))m.innerHTML="<div style='padding:20px;color:#c55'>오류: "+String(e.message).replace(/</g,"&lt;")+"</div>";});</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";
const TZ = "Asia/Seoul";
const DOW = ["일","월","화","수","목","금","토"];
const CATS = ["음료·바","위생·청소","화장실","운영","기타"];
const SUP_STATUS = {ok:["충분","s-good"], low:["부족","s-bad"], ordered:["주문함","s-warn"], arrived:["도착","s-accent"]};
const ON_TIME_LIMIT = "07:00";
const TA = "text" + "area";
const PHOTO_MAX_AGE_MS = 3*60*1000;

const S = {
  tab:"today", loaded:false, busy:false,
  me:null, pin:"", ownerPin:"", isOwner:false,
  managers:{}, att:{}, changes:{}, supplies:{}, purchases:[], rewards:{}, events:{}, checks:{}, evening:{}, checklist:null,
  calMonth:null, supFilter:"all", sumMonth:null, photos:{}, ownerPinSet:true, kakao:false, board:null, boardFilter:"all", openPost:null, postPhotos:{}
};

/* ---------- storage (per device) ---------- */
const store = {
  get(k){ try{ return localStorage.getItem("hongje."+k) || ""; }catch(e){ return ""; } },
  set(k,v){ try{ v ? localStorage.setItem("hongje."+k, v) : localStorage.removeItem("hongje."+k); }catch(e){} }
};

/* ---------- server ---------- */
const SB_URL = "https://meetkfmgmgqnlyjzfacb.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZXRrZm1nbWdxbmx5anpmYWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTE3OTcsImV4cCI6MjEwODEyNzc5N30.wCjaMZAqv76uPL97sT70mHwwIDf44oqnNwJxVZHoaO8";
async function call(action, payload){
  let r;
  try{
    r = await fetch(SB_URL + "/functions/v1/api", { method:"POST", headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer "+SB_KEY },
      body: JSON.stringify({ action, p: Object.assign({mid:S.me, pin:S.pin, ownerPin:S.ownerPin}, payload||{}) }) });
  }catch(e){ throw new Error("인터넷 연결을 확인해 주세요."); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error("요청을 처리하지 못했어요. 잠시 후 다시 시도해 주세요."); }
  if (!j.ok) throw new Error(j.error || "요청을 처리하지 못했어요.");
  return j.result;
}
const errMsg = e => (e && e.message ? String(e.message).replace(/^Error:\s*/,"") : "요청을 처리하지 못했어요. 잠시 후 다시 시도해 주세요.");
async function act(fn, okMsg){
  try{ const r = await fn(); okMsg && toast(okMsg); await refresh(); return r ?? true; }
  catch(e){ toast(errMsg(e)); return false; }
}
let refreshing = false;
async function refresh(){
  if (refreshing) return; refreshing = true;
  try{
    const d = await call("load", {month:S.calMonth});
    const map = {};
    d.managers.forEach(m => { map[m.id] = m; });
    Object.assign(S, {managers:map, att:d.att, changes:d.changes, supplies:d.supplies, purchases:d.purchases, rewards:d.rewards, events:d.events, checks:d.checks, evening:d.evening||{}, checklist:d.checklist, isOwner:d.isOwner, ownerPinSet:d.ownerPinSet, kakao:d.kakao, kakaoKey:d.kakaoKey, kakaoSecret:d.kakaoSecret, kakaoRedirect:d.kakaoRedirect, kakaoList:d.kakaoList||[], notifyEmails:d.notifyEmails||'', board:d.board||null, attFixes:d.attFixes||{}, loaded:true});
    if (S.ownerPin && !d.isOwner){ S.ownerPin=""; store.set("ownerPin",""); }
    if (S.isOwner) S.me = ownerMid();
    if (S.me && !S.managers[S.me]) { S.me=null; S.pin=""; store.set("me",""); store.set("pin",""); }
    pushSync();
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.closest && ae.closest("#main") && ae.value;
    if (!document.querySelector(".scrim") && !typing) render();
    else renderChrome();
  }catch(e){
    if (!S.loaded) document.getElementById("main").innerHTML = `<div class="card empty"><b>불러오지 못했어요</b>${esc(errMsg(e))}</div>`;
  }finally{ refreshing = false; }
}

/* ---------- time helpers (Seoul) ---------- */
const fmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function seoul(d=new Date()){const o={};fmt.formatToParts(d).forEach(p=>o[p.type]=p.value);const h=o.hour==="24"?"00":o.hour;return {date:`${o.year}-${o.month}-${o.day}`,hm:`${h}:${o.minute}`,ym:`${o.year}-${o.month}`};}
const wd = date => new Date(date+"T00:00:00Z").getUTCDay();
const addDays = (date,n) => {const d=new Date(date+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const daysInMonth = ym => {const [y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate();};
const shiftMonth = (ym,n) => {const [y,m]=ym.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.toISOString().slice(0,7);};
const ymLabel = ym => {const [y,m]=ym.split("-");return `${y}년 ${Number(m)}월`;};
const dLabel = date => {const [,m,d]=date.split("-");return `${Number(m)}월 ${Number(d)}일 (${DOW[wd(date)]})`;};
const mins = hm => {const [h,m]=hm.split(":").map(Number);return h*60+m;};
const dur = n => n==null?"–":`${Math.floor(n/60)}시간 ${n%60}분`;
const won = n => (Number(n)||0).toLocaleString("ko-KR")+"원";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(u||"") ? u : "";

/* ---------- derived schedule & status ---------- */
const activeManagers = () => Object.entries(S.managers).filter(([,m])=>m.active!==false).sort((a,b)=>(a[1].order??0)-(b[1].order??0)||a[1].name.localeCompare(b[1].name));
const mName = id => S.managers[id]?.name || "미지정";
function ownerMid(){const e=Object.entries(S.managers).find(([,m])=>m.role==="owner"&&m.active!==false);return e?e[0]:null;}
function changesFor(date){return Object.entries(S.changes).filter(([,c])=>c.date===date && c.type!=="eswap");}
function eveSwaps(date, mid){return Object.entries(S.changes).filter(([,c])=>c.date===date && c.type==="eswap" && (!mid || c.fromMid===mid));}
function eveSub(date, mid){const a = eveSwaps(date, mid).filter(([,c])=>c.state==="approved"); return a.length ? a[a.length-1][1].toMid : null;}
function evePending(date, mid){return eveSwaps(date, mid).filter(([,c])=>c.state==="requested");}
function mySubToday(date){return Object.values(S.changes).filter(c=>c.date===date && c.type==="eswap" && c.state==="approved" && c.toMid===S.me);}
function eventsFor(date){return Object.entries(S.events).filter(([,e])=>e.date===date);}
function startsOn(date){return activeManagers().filter(([,m])=>m.startDate===date);}
const morningManagers = () => activeManagers().filter(([,m])=>m.duty!=="evening");
const isEveningPerson = id => S.managers[id]?.duty==="evening";
function eveningFor(date){ const w = wd(date); return activeManagers().filter(([,m])=>m.duty==="evening" && (m.days||[]).includes(w) && (!m.startDate || date >= m.startDate)); }
function eveRec(date, mid){ return S.evening[date+"__"+mid]; }
const eveCovered = (r, mid) => !!(r && r.by && r.by !== mid);
function eveText(date, id, m){ const r = eveRec(date,id), sub = eveSub(date,id); return eveCovered(r,id) ? `저녁 ${esc(r.byName||mName(r.by))} 대신 ✓` : r ? `저녁 ${esc(m.name)} ✓` : sub ? `저녁 ${esc(mName(sub))} 대타` : `저녁 ${esc(m.name)}`; }
function eveningTags(date){ return eveningFor(date).map(([id,m])=>{ const r = eveRec(date,id); return `<span class="pill ${eveCovered(r,id)||(!r&&eveSub(date,id))?"s-accent":r?"s-good":"s-plan"}">${eveText(date,id,m)}</span>`; }).join(""); }
function eveOwnerControls(date){
  if (!S.isOwner) return "";
  return eveningFor(date).map(([id,m])=>{
    const r = eveRec(date,id);
    const sub = eveSub(date,id);
    const st = !r ? (sub ? `${esc(mName(sub))}님 대타 ${date < seoul().date ? "· 완료 기록 없음" : "예정"}` : date < seoul().date ? "완료 기록 없음" : "예정") : eveCovered(r,id) ? `${esc(r.byName||mName(r.by))}님이 대신 처리 · <span class="num">${esc(r.hm)}</span>` : `${esc(m.name)}님 완료 · <span class="num">${esc(r.hm)}</span>`;
    const btns = !r ? `<button class="btn small primary" data-eveown="cover" data-mid="${id}" data-date="${date}">내가 대신 했어요</button>${sub&&sub!==ownerMid()?`<button class="btn small" data-eveown="sub" data-by="${sub}" data-mid="${id}" data-date="${date}">${esc(mName(sub))} 완료로 기록</button>`:`<button class="btn small" data-eveown="done" data-mid="${id}" data-date="${date}">${esc(m.name)} 완료로 기록</button>`}`
      : `<button class="btn small ghost" data-eveown="undo" data-mid="${id}" data-date="${date}">기록 취소</button>`;
    return `<div class="item"><div class="nm">저녁 분리수거 <span class="faint">${esc(m.name)} 담당</span><div class="faint" style="font-size:12.5px">${st}</div></div><div class="acts">${btns}</div></div>`;
  }).join("");
}
function bindEveOwn(root, done){
  root.querySelectorAll("[data-eveown]").forEach(b=>b.addEventListener("click", async()=>{
    const mode = b.dataset.eveown, msg = {cover:"대신 처리한 것으로 기록했어요", done:"완료로 기록했어요", sub:"대타 완료로 기록했어요", undo:"기록을 취소했어요"}[mode];
    busyBtn(b);
    const ok = await act(()=>call("eveningToggle",{date:b.dataset.date, target:b.dataset.mid, on:mode!=="undo", cover:mode==="cover", byMid:mode==="sub"?b.dataset.by:""}), msg);
    if (ok && done) done(); else if (!ok) freeBtn(b);
  }));
}
function dayTags(date){return eventsFor(date).map(([,e])=>`<span class="pill s-accent">${esc(e.title)}</span>`).join("")+startsOn(date).map(([,m])=>`<span class="pill s-good">${esc(m.name)} 첫 출근</span>`).join("")+eveningTags(date);}
function eveCount(ym, mid){ const n = daysInMonth(ym), today = seoul().date; let due = 0, done = 0, cover = 0; for (let d=1; d<=n; d++){ const date = `${ym}-${String(d).padStart(2,"0")}`; if (date > today) break; if (eveningFor(date).some(([id])=>id===mid) && !eveSub(date, mid)) due++; const r = eveRec(date, mid); if (r) { if (eveCovered(r, mid)) cover++; else done++; } } return {due, done, cover}; }
function dayInfo(date){
  const w = wd(date);
  const base = morningManagers().find(([,m])=>(m.days||[]).includes(w) && (!m.startDate || date >= m.startDate));
  const baseId = base ? base[0] : null;
  const approved = changesFor(date).find(([,c])=>c.state==="approved");
  const pending = changesFor(date).filter(([,c])=>c.state==="requested");
  if (approved){
    const c = approved[1];
    if (c.type==="off") return {mid:null, baseId, off:true, cover:ownerMid(), change:c, pending};
    if (c.type==="swap") return {mid:c.toMid, baseId, swap:true, change:c, pending};
  }
  return baseId ? {mid:baseId, baseId, pending} : {mid:null, baseId:null, cover:ownerMid(), pending};
}
const attKey = (date,mid) => `${date}__${mid}`;
function recFor(date,mid){return mid ? S.att[attKey(date,mid)] : null;}
function statusOf(date, mid, info){
  const now = seoul();
  if (info && !info.mid && info.cover){ const rc = recFor(date, info.cover); if (rc?.inHM) return ["점주 근무","s-accent","mk-accent"]; return [info.off?"휴무 · 점주 대신":"점주 담당","s-off","mk-off"]; }
  if (info?.off) return ["휴무","s-off","mk-off"];
  if (!mid) return ["배정 없음","s-plan","mk-plan"];
  const r = recFor(date,mid);
  if (r?.statusOverride){const o=r.statusOverride;return [o, o==="출근"?"s-good":o==="지각"?"s-warn":"s-bad", o==="출근"?"mk-good":o==="지각"?"mk-warn":"mk-bad"];}
  if (r?.inHM) return r.inHM > ON_TIME_LIMIT ? ["지각","s-warn","mk-warn"] : ["출근","s-good","mk-good"];
  if (date < now.date) return ["결근","s-bad","mk-bad"];
  if (date === now.date) return now.hm > ON_TIME_LIMIT ? ["미출근","s-bad","mk-bad"] : ["출근 전","s-plan","mk-plan"];
  return ["예정","s-plan","mk-plan"];
}
function monthStats(ym, mid){
  const n = daysInMonth(ym), today = seoul().date;
  const s = {scheduled:0, worked:0, onTime:0, late:0, absent:0, minutes:0};
  for (let d=1; d<=n; d++){
    const date = `${ym}-${String(d).padStart(2,"0")}`;
    const info = dayInfo(date);
    const r = recFor(date, mid);
    const isMine = info.mid===mid;
    if (!isMine && !r) continue;
    if (isMine && date<=today) s.scheduled++;
    const [lab] = statusOf(date, mid, isMine?info:{mid});
    if (lab==="출근"){s.onTime++;s.worked++;}
    else if (lab==="지각"){s.late++;s.worked++;}
    else if (lab==="결근") s.absent++;
    if (r?.inAt && r?.outAt) s.minutes += Math.max(0, Math.round((Date.parse(r.outAt)-Date.parse(r.inAt))/60000));
  }
  return s;
}

/* ---------- checklist helpers ---------- */
function hid(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.codePointAt(0))|0;return "i"+(h>>>0).toString(36);}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");}
const itemText = t => typeof t==="string" ? t : (t?.text||"");
const itemOn = (t,date) => typeof t==="string" || !(t?.days?.length) || t.days.includes(wd(date));
function parseItem(s){
  let days = null, link = "", linkLabel = "", text = s;
  const m = text.match(/^\[([월화수목금토일,·\s]+)\]\s*/);
  if (m){ days = [...m[1].replace(/[,·\s]/g,"")].map(c=>DOW.indexOf(c)).filter(x=>x>=0); text = text.slice(m[0].length); }
  const p = text.split(" | ");
  if (p.length>1){ const tail = p.pop().trim(); text = p.join(" | ").trim(); const u = tail.match(/https:\/\/\S+$/); if (u){ link = u[0]; linkLabel = tail.slice(0, u.index).trim(); } else text += " | "+tail; }
  if (!days?.length && !link) return text;
  const o = {text}; if (days?.length) o.days = days; if (link){ o.link = link; if (linkLabel) o.linkLabel = linkLabel; } return o;
}
function serItem(i){ if (typeof i==="string") return i; return `${i.days?.length?`[${i.days.map(x=>DOW[x]).join(",")}] `:""}${i.text}${i.link?` | ${i.linkLabel||"영상"} ${i.link}`:""}`; }
function checkCount(date){const T=S.checklist, d=S.checks[date]?.items||{}; let total=0, done=0; (T?.sections||[]).forEach(sec=>(sec.items||[]).filter(t=>itemOn(t,date)).forEach(t=>{total++; if (d[hid(itemText(t))]) done++;})); return {total, done};}
function checklistHtml(date, editable, withHeader){
  const T = S.checklist;
  if (!T?.sections?.length) return "";
  const d = S.checks[date]?.items || {}; const c = checkCount(date);
  let h = "";
  if (withHeader) h += `<section><div class="spread"><h2>오늘 체크리스트 <span class="sub num">${c.done}/${c.total}</span></h2>${c.total&&c.done===c.total?`<span class="pill s-good">모두 완료</span>`:""}</div><div class="progress"><i style="width:${c.total?c.done/c.total*100:0}%"></i></div>${editable?"":`<div class="faint" style="font-size:12.5px">체크하려면 오른쪽 위에서 로그인해 주세요.</div>`}`;
  h += `<div class="list">`;
  T.sections.forEach(sec=>{
    const its = (sec.items||[]).filter(t=>itemOn(t,date));
    if (!its.length) return;
    h += `<div class="catlabel">${esc(sec.title)}</div>`;
    its.forEach(t=>{
      const id = hid(itemText(t)), v = d[id], lk = typeof t==="string" ? "" : safeUrl(t.link);
      h += `<label class="chk ${v?"done":""}"><input type="checkbox" id="c-${date}-${id}" data-chk="${id}" data-date="${date}" data-text="${esc(itemText(t))}" ${v?"checked":""} ${editable?"":"disabled"}><span class="t">${rich(itemText(t))}${t.days?.length?` <span class="pill s-accent" style="font-size:11px">${t.days.map(x=>DOW[x]).join("·")}요일</span>`:""}${lk?`<br><a class="vid" href="${esc(lk)}" target="_blank" rel="noopener">▶ ${esc(t.linkLabel||"영상 보기")}</a>`:""}</span><span class="by">${v?.hm?esc(v.hm):""}</span></label>`;
    });
  });
  h += `</div>`;
  if (withHeader) h += `</section>`;
  return h;
}
let checkChain = Promise.resolve();
function toggleCheck(date, id, text, on){
  const items = ((S.checks[date] = S.checks[date] || {items:{}}).items);
  const prev = items[id];
  items[id] = on ? {hm:seoul().hm} : undefined;
  if (!on) delete items[id];
  render();
  checkChain = checkChain.then(()=>call("toggleCheck",{date, itemId:id, text, on}).catch(e=>{
    if (prev) items[id]=prev; else delete items[id];
    toast(errMsg(e)); render();
  }));
}

/* ---------- ui primitives ---------- */
let toastT;
function toast(msg){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800);}
function closeSheet(){document.getElementById("sheetRoot").innerHTML=""; render();}
function openSheet(html, bind){
  const root=document.getElementById("sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheet));
  bind && bind(root.querySelector(".sheet"));
  root.querySelector("input:not([type=checkbox]),select,textarea")?.focus();
}
function busyBtn(btn, text){ btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = text || "처리 중…"; }
function freeBtn(btn){ btn.disabled = false; if (btn.dataset.label) btn.textContent = btn.dataset.label; }
const loggedIn = () => !!(S.isOwner || (S.me && S.pin));
function needLogin(){ if (loggedIn()) return false; loginSheet(); return true; }

/* ---------- render ---------- */
function renderChrome(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  document.getElementById("admintab").hidden = !S.isOwner;
  const low = Object.values(S.supplies).filter(s=>s.status==="low").length;
  const lc = document.getElementById("lowcnt"); lc.hidden = !low; lc.textContent = low;
  const nb = boardUnread(); const bc = document.getElementById("boardcnt"); if (bc){ bc.hidden = !nb; bc.textContent = nb; }
  { const n = S.loaded ? swapLists().inc.length : 0; const e = document.getElementById("swapcnt"); if (e){ e.hidden = !n; e.textContent = n; } }
  const el = document.getElementById("who");
  const label = S.isOwner ? `${S.me?esc(mName(S.me))+" · ":""}점주` : (S.me && S.pin) ? esc(mName(S.me))+" 매니저" : "";

}
function render(){
  renderChrome();

  if (!S.loaded){ main.innerHTML = `<div class="empty"><b>불러오는 중</b>매장 기록을 가져오고 있어요.</div>`; return; }
  const v = {today:viewToday, cal:viewCal, sup:viewSup, board:viewBoard, admin:viewAdmin}[S.tab] || viewToday;
  main.innerHTML = v();
  bindMain(main);
}

function viewToday(){
  const now = seoul(), date = now.date, info = dayInfo(date);
  const managers = activeManagers();
  let html = "";
  if (!managers.length) return `<div class="card empty"><b>아직 등록된 매니저가 없어요</b>점주 화면의 관리 탭에서 매니저를 등록해 주세요.</div>`;
  if (!S.isOwner && S.pin && isEveningPerson(S.me) && info.mid !== S.me) return viewEvening(now, date);
  html += swapInbox() + pushCard();
  if (S.isOwner){ const n = Object.values(S.attFixes||{}).filter(f=>f.state==="requested").length; if (n) html += `<section><div class="card spread"><div><b>🕘 출근 기록 정정 요청 ${n}건</b><div class="faint" style="font-size:13px">관리 탭에서 확인하고 승인해 주세요.</div></div><button class="btn small primary" data-gotab="admin">보러 가기</button></div></section>`; }
  const sMid = S.isOwner ? (info.mid || info.cover || null) : (S.me && S.pin ? S.me : (info.mid || info.cover || null));
  const mine = loggedIn() && sMid && sMid === S.me;
  const r = recFor(date, sMid);
  const [lab, cls] = statusOf(date, sMid, (S.isOwner || !S.pin || info.mid===S.me || info.cover===S.me) ? info : {mid:sMid});
  const n = mins(now.hm), start = mins("06:30"), end = mins("07:00");
  const pct = Math.max(0, Math.min(100, (n-start)/(end-start)*100));
  html += `<section><h2>오늘 <span class="sub">${dLabel(date)}</span></h2><div class="card today">`;
  html += `<div class="spread"><div><div class="date">${!S.isOwner && S.pin ? (info.mid===S.me?"오늘은 근무일이에요":"오늘은 근무 예정이 아니에요") : "오늘 근무"}</div><div class="who-big">${sMid?esc(mName(sMid)):"배정 없음"}</div></div><span class="pill ${cls}">${lab}</span></div>`;
  html += dayTags(date) ? `<div class="row">${dayTags(date)}</div>` : "";
  if (!S.isOwner && S.pin && info.mid!==S.me && !r) html += `<div class="note">${info.mid?`오늘 담당은 ${esc(mName(info.mid))} 매니저예요.`:"오늘은 배정된 매니저가 없어요."} 대신 출근했다면 그대로 출근 버튼을 눌러 주세요.</div>`;
  html += `<div class="window"><span class="num">06:30</span><span class="bar"><i style="width:${pct}%"></i></span><span class="num">07:00</span></div>`;
  html += `<div class="faint" style="font-size:12.5px;margin-top:-8px">06:30~07:00 사이에 오면 출근, 07:00 이후는 지각이에요.</div>`;
  if (r?.inHM){
    html += `<div class="stamp"><div><span>출근</span><b>${esc(r.inHM)}</b></div><div><span>퇴근</span><b>${esc(r.outHM||"–")}</b></div></div>`;
    if (r.hasPhoto) html += photoSlot(attKey(date,sMid), `${mName(sMid)} 출근 사진, ${r.inHM} 촬영`);
    if (r.memo) html += `<div class="note"><b>메모</b> · ${esc(r.memo)}</div>`;
  }
  if (!loggedIn()){
    html += `<button class="btn primary big" data-act="login">로그인하고 출근하기</button>`;
  } else if (mine || (!S.isOwner && S.pin)){
    const myRec = recFor(date, S.me);
    if (!myRec?.inHM) html += `<button class="btn primary big" data-act="clock-in">매장 사진 찍고 출근하기</button><div class="faint" style="font-size:12.5px;text-align:center;margin-top:-6px">카메라가 바로 열려요. 앨범 사진은 사용할 수 없어요.</div>`;
    else if (!myRec.outHM) html += `<button class="btn primary big" data-act="clock-out">퇴근하기</button>`;
    else html += `<div class="note">오늘 근무 기록이 끝났어요. 수고하셨어요.</div>`;
  }
  html += `</div></section>`;
  if (!S.isOwner && S.pin) mySubToday(date).forEach(c=>{ const er = eveRec(date, c.fromMid), mineDone = er && er.by===S.me;
    html += `<section><h2>오늘 저녁 분리수거 대타</h2><div class="card"><div class="spread"><div class="muted">${esc(mName(c.fromMid))}님 대신 분리수거를 맡았어요.</div><span class="pill ${er?"s-good":"s-plan"}">${er?`완료 ${esc(er.hm)}`:"예정"}</span></div>${!er?`<button class="btn primary" style="margin-top:10px" data-act="esub-done" data-mid="${c.fromMid}">분리수거 완료</button>`:mineDone?`<button class="btn ghost" style="margin-top:10px" data-act="esub-undo" data-mid="${c.fromMid}">완료 취소</button>`:""}</div></section>`; });
  if (S.isOwner && eveningFor(date).length) html += `<section><h2>오늘 저녁</h2><div class="list">${eveOwnerControls(date)}</div></section>`;
  html += checklistHtml(date, loggedIn(), true);

  const ym = now.ym;
  if (!S.isOwner && S.me && S.pin){
    const st = monthStats(ym, S.me);

  }

    const d = addDays(date,i), inf = dayInfo(d);

    const pend = inf.pending.length?`<span class="pill s-warn">변경 요청</span>`:"";
    const who = inf.mid ? esc(mName(inf.mid)) : inf.cover ? `<span class="faint">${esc(mName(inf.cover))}</span>` : "–";

}
function photoSlot(key, alt){

function viewEvening(now, date){
  const mine = eveningFor(date).some(([id])=>id===S.me);
  const r = eveRec(date, S.me), sub = mine ? eveSub(date, S.me) : null;
  let html = swapInbox() + pushCard() + `<section><h2>오늘 <span class="sub">${dLabel(date)}</span></h2><div class="card today">`;
  html += `<div class="spread"><div><div class="date">${mine?"오늘 저녁 담당이에요":"오늘은 저녁 담당일이 아니에요"}</div><div class="who-big">쓰레기 분리수거</div></div><span class="pill ${eveCovered(r,S.me)||sub?"s-accent":r?"s-good":mine?"s-plan":"s-off"}">${eveCovered(r,S.me)?"대신 처리됨":r?`완료 ${esc(r.hm)}`:sub?"대타":mine?"예정":"없음"}</span></div>`;
  if (!r && sub) html += `<div class="note">오늘 저녁 분리수거는 ${esc(mName(sub))}님이 대타예요.</div>`;
  else if (eveCovered(r,S.me)) html += `<div class="note">오늘은 ${esc(r.byName||mName(r.by))}님이 대신 분리수거를 했어요 (<span class="num">${esc(r.hm)}</span>).</div>`;
  else {
    html += `<div class="faint" style="font-size:12.5px">분리수거를 내놓은 뒤 완료를 눌러 주세요.</div>`;
    if (!r) html += `<button class="btn primary big" data-act="eve-done">분리수거 완료</button>`;
    else html += `<button class="btn ghost" data-act="eve-undo">완료 취소</button>`;
  }
  html += `</div></section>`;
  const st = eveCount(now.ym, S.me);
  html += `<section><h2>${ymLabel(now.ym)} 나의 기록</h2><div class="card"><div class="stamp"><div><span>분리수거 완료</span><b>${st.done}</b></div><div><span>오늘까지 담당일</span><b>${st.due}</b></div></div>${st.cover?`<div class="faint" style="font-size:12.5px;margin-top:8px">다른 사람이 대신 처리한 날 ${st.cover}일</div>`:""}</div></section>`;
  html += `<div class="faint" style="font-size:12.5px;margin:-4px 2px 4px">날짜를 누르면 분리수거 대타를 요청할 수 있어요.</div>`;
  html += `<section><h2>앞으로 7일</h2><div class="list">`;
  for (let i=1;i<=7;i++){
    const d = addDays(date,i), inf = dayInfo(d);
    const eve = eveningFor(d).some(([id])=>id===S.me);
    const morning = inf.mid===S.me, esub = eve ? eveSub(d, S.me) : null, epend = eve && evePending(d, S.me).length;
    const tags = (eve?(esub?`<span class="pill s-accent">분리수거 ${esc(mName(esub))} 대타</span>`:`<span class="pill s-plan">저녁 분리수거</span>`):"")+(epend?`<span class="pill s-warn">대타 요청</span>`:"")+(morning?`<span class="pill s-accent">오전 대타</span>`:"");
    html += `<div class="item" data-act="open-day" data-date="${d}" style="cursor:pointer"><div class="nm">${dLabel(d)}</div><div class="acts">${tags||`<span class="faint">–</span>`}</div></div>`;
  }
  html += `</div></section>`;
  return html;
}

function viewCal(){
  const ym = S.calMonth, today = seoul().date;
  const first = `${ym}-01`, lead = wd(first), n = daysInMonth(ym);
  let cells = DOW.map((d,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("");
  for (let i=0;i<lead;i++) cells += `<div class="day blank" aria-hidden="true"></div>`;
  for (let d=1; d<=n; d++){
    const date = `${ym}-${String(d).padStart(2,"0")}`, info = dayInfo(date);
    const [lab,,mk] = statusOf(date, info.mid, info);
    const r = recFor(date, info.mid || info.cover);
    cells += `<button class="day ${date===today?"today":""}" data-act="open-day" data-date="${date}" aria-label="${dLabel(date)} ${esc(mName(info.mid||info.cover))} ${lab}">
      <span class="dn">${d}</span>
      <span class="nm">${info.mid?esc(mName(info.mid)):info.cover?`<span class="faint">${esc(mName(info.cover))}</span>`:""}</span>
      ${eventsFor(date).map(([,e])=>`<span class="ev">${esc(e.title)}</span>`).join("")}${startsOn(date).map(([,m])=>`<span class="ev st">${esc(m.name)} 첫 출근</span>`).join("")}${eveningFor(date).map(([id,m])=>`<span class="ev eve${eveCovered(eveRec(date,id),id)?" cov":""}">${eveText(date,id,m)}</span>`).join("")}
      <span class="tm">${r?.inHM?esc(r.inHM):""}</span>
      ${info.pending.length||evePending(date).length?`<span class="req">요청</span>`:""}
      <span class="mark ${mk}"></span></button>`;
  }
  return `<section>
    <div class="calhead"><button class="btn small ghost" data-act="cal-prev" aria-label="이전 달">←</button><b>${ymLabel(ym)}</b><button class="btn small ghost" data-act="cal-next" aria-label="다음 달">→</button></div>
    <div class="legend"><span class="pill s-good">출근</span><span class="pill s-warn">지각</span><span class="pill s-bad">결근</span><span class="pill s-plan">예정</span></div>
    <div class="cal">${cells}</div>
    <div class="faint" style="font-size:12.5px">날짜를 누르면 그날 기록과 체크리스트를 보고, 대타를 요청할 수 있어요.</div>
  </section>`;
}

function viewSup(){
  const all = Object.entries(S.supplies);
  if (!all.length) return `<div class="card empty"><b>비품 목록이 비어 있어요</b>${S.isOwner?`<div style="margin-top:12px"><button class="btn primary" data-act="sup-new">비품 추가</button></div>`:"점주가 비품을 등록하면 여기서 부족을 알릴 수 있어요."}</div>`;
  const counts = {all:all.length, low:0, ordered:0, arrived:0};
  all.forEach(([,s])=>{if(counts[s.status]!=null)counts[s.status]++;});
  const f = S.supFilter;
  const shown = all.filter(([,s])=> f==="all" || s.status===f);
  let html = "";
  if (counts.low) html += `<div class="alert">부족한 비품 ${counts.low}개${S.isOwner?" · 주문이 필요해요":" · 점주에게 알렸어요"}</div>`;
  html += `<section><div class="spread"><div class="filters">
    ${[["all","전체"],["low","부족"],["ordered","주문함"],["arrived","도착"]].map(([k,l])=>`<button class="chip" data-act="sup-filter" data-f="${k}" aria-pressed="${f===k}">${l} <span class="num">${counts[k]}</span></button>`).join("")}
  </div>${S.isOwner?`<button class="btn small" data-act="sup-new">+ 비품 추가</button>`:""}</div>`;
  if (!shown.length){ html += `<div class="card empty">이 상태의 비품이 없어요.</div></section>`; return html; }
  html += `<div class="list">`;
  const rank = {low:0,ordered:1,arrived:2,ok:3};
  CATS.forEach(cat=>{
    const items = shown.filter(([,s])=>(CATS.includes(s.cat)?s.cat:"기타")===cat).sort((a,b)=>(rank[a[1].status]??4)-(rank[b[1].status]??4)||a[1].name.localeCompare(b[1].name));
    if (!items.length) return;
    html += `<div class="catlabel">${cat}</div>`;
    items.forEach(([id,s])=>{
      const [sl,sc] = SUP_STATUS[s.status]||SUP_STATUS.ok;
      const link = safeUrl(s.link);
      let acts = "";
      if (s.status==="ok") acts = `<button class="btn small" data-act="sup-low" data-id="${id}">부족해요</button>`;
      if (s.status==="low"){
        acts = S.isOwner
          ? `${link?`<a class="btn small" href="${esc(link)}" target="_blank" rel="noopener">구매처 ↗</a>`:""}<button class="btn small primary" data-act="sup-order" data-id="${id}">주문함</button>`
          : `<button class="btn small ghost" data-act="sup-ok" data-id="${id}">요청 취소</button>`;
      }
      if (s.status==="ordered") acts = `<button class="btn small" data-act="sup-arrived" data-id="${id}">도착했어요</button>`;
      if (s.status==="arrived") acts = `<button class="btn small" data-act="sup-ok" data-id="${id}">채웠어요</button>`;
      if (S.isOwner) acts += `<button class="btn small ghost" data-act="sup-edit" data-id="${id}" aria-label="${esc(s.name)} 수정">수정</button>`;
      const meta = [];
      if (s.status==="low" && s.requestedAt) meta.push(`${esc(s.requestedBy?mName(s.requestedBy):"")} 요청 · ${esc(seoul(new Date(s.requestedAt)).date.slice(5).replace("-","/"))}`);
      if (s.note && s.status==="low") meta.push(`“${esc(s.note)}”`);
      if (s.vendor==="본사 발주") meta.push("본사 발주");
      if (s.price) meta.push(`<span class="num">${won(s.price)}</span>${s.unit?` / ${esc(s.unit)}`:""}`);
      if (s.lastBought) meta.push(`최근 구매 ${esc(s.lastBought.slice(5).replace("-","/"))}`);
      html += `<div class="item"><div class="row" style="min-width:0"><span class="nm">${esc(s.name)}</span><span class="pill ${sc}">${sl}</span></div><div class="acts">${acts}</div>${meta.length?`<div class="meta">${meta.join("<span>·</span>")}</div>`:""}</div>`;
    });
  });
  html += `</div></section>`;
  return html;
}

function viewAdmin(){
  if (!S.isOwner) return `<div class="card empty">점주만 볼 수 있어요.</div>`;
  if (!S._notifyFetched){ S._notifyFetched = true; call("notifyInfo").then(d=>{ Object.assign(S,{kakao:!!d.kakao, kakaoList:d.kakaoList||[], notifyEmails:d.notifyEmails||"", kakaoKey:!!d.kakaoKey, kakaoSecret:!!d.kakaoSecret, kakaoRedirect:d.kakaoRedirect||""}); if (S.tab==="admin" && !document.querySelector(".scrim")) render(); }).catch(()=>{ S._notifyFetched = false; }); }
  const ym = S.sumMonth;
  const managers = activeManagers().filter(([,m])=>m.role!=="owner");
  const reward = S.rewards[ym]?.amount;
  let html = `<section><div class="calhead"><button class="btn small ghost" data-act="sum-prev" aria-label="이전 달">←</button><b>${ymLabel(ym)} 근무 요약</b><button class="btn small ghost" data-act="sum-next" aria-label="다음 달">→</button></div>`;
  if (!managers.length) html += `<div class="card empty"><b>매니저가 없어요</b>아래에서 매니저를 등록하면 월 요약이 계산돼요.</div>`;

    html += `<div class="tblwrap"><table><thead><tr><th>매니저</th><th class="r">근무일</th><th class="r">출근</th><th class="r">지각</th><th class="r">결근</th><th class="r">근무시간</th><th>리워드</th><th class="r">예상 지급액</th></tr></thead><tbody>`;
    const stats = {}, wagePay = {}, notes = [];
    managers.forEach(([id,m])=>{ stats[id] = monthStats(ym,id); });
    managers.forEach(([id,m])=>{
      const to = (m.payTo && S.managers[m.payTo]) ? m.payTo : id;

    });
    managers.forEach(([id,m])=>{
      const st = stats[id], eve = m.duty==="evening";

      const eligible = !eve && st.late===0 && st.absent===0;
      const payCell = redirected ? `<span class="faint">${esc(S.managers[m.payTo].name)}에게 합산</span>` : won((wagePay[id]||0) + (eligible ? (Number(reward)||0) : 0));
      const rewardCell = eve ? `<span class="pill s-plan">이용권</span>` : eligible?`<span class="pill s-good">대상</span>`:`<span class="pill s-off">제외</span>`;
      html += `<tr><td><b>${esc(m.name)}</b>${eve?` <span class="faint" style="font-size:12px">저녁</span>`:""}</td><td class="r num">${st.worked}/${st.scheduled}</td><td class="r num">${st.onTime}</td><td class="r num">${st.late}</td><td class="r num">${st.absent}</td><td class="r num">${dur(st.minutes)}</td><td>${rewardCell}</td><td class="r num">${payCell}</td></tr>`;
    });
    S._payNotes = notes;
    html += `</tbody></table></div>`;
    (S._payNotes||[]).forEach(t=>{ html += `<div class="faint" style="font-size:12.5px">${esc(t)}</div>`; });
    managers.filter(([,m])=>m.duty==="evening").forEach(([id,m])=>{ const c = eveCount(ym, id); html += `<div class="muted" style="font-size:13.5px">${esc(m.name)} 저녁 분리수거 <b class="num" style="color:var(--ink)">${c.done}/${c.due}</b>회 완료 (오늘까지)${c.cover?` · 다른 사람이 대신 <b class="num" style="color:var(--ink)">${c.cover}</b>회`:""}</div>`; });
  }
  html += `<div class="spread"><div class="muted" style="font-size:13.5px">이달의 감사 리워드 <b class="num" style="color:var(--ink)">${reward!=null?won(reward):"미입력"}</b> · 지각·결근 0회일 때 지급</div><button class="btn small" data-act="reward-edit">금액 ${reward!=null?"수정":"입력"}</button></div>`;
  html += `<div class="faint" style="font-size:12.5px">예상 지급액 = 출근~퇴근 기록 시간 × 시급 + 리워드. 퇴근을 누르지 않은 날은 근무시간에 들어가지 않아요.</div></section>`;

  const pend = Object.entries(S.changes).filter(([,c])=>c.state==="requested").sort((a,b)=>a[1].date.localeCompare(b[1].date));
  html += `<section><h2>수락 대기 중인 대타 <span class="sub">${pend.length}건</span></h2><div class="faint" style="font-size:12.5px;margin:-4px 2px 8px">당사자가 수락하면 자동으로 확정돼요. 급할 땐 여기서 바로 확정하거나 거절할 수 있어요.</div>`;

  else {
    html += `<div class="list">`;
    pend.forEach(([id,c])=>{
      html += `<div class="item"><div style="min-width:0"><div class="nm">${dLabel(c.date)} · ${c.type==="eswap"?"저녁 분리수거 대타":"오전 대타"} <span class="pill s-warn">수락 대기</span></div><div class="faint" style="font-size:13px">${esc(mName(c.fromMid))} → ${esc(mName(c.toMid))}${c.note?` · ${esc(c.note)}`:""}</div></div><div class="acts"><button class="btn small ghost danger" data-act="chg-reject" data-id="${id}">거절</button><button class="btn small primary" data-act="chg-approve" data-id="${id}">승인</button></div></div>`;
    });
    html += `</div>`;
  }
  html += `</section>`;

  { const fx = Object.entries(S.attFixes||{}).filter(([,f])=>f.state==="requested").sort((a,b)=>a[1].date.localeCompare(b[1].date));
    if (fx.length){
      html += `<section><h2>출근 기록 정정 요청 <span class="sub">${fx.length}건</span></h2><div class="faint" style="font-size:12.5px;margin:-4px 2px 8px">승인하면 적힌 시각으로 기록이 바뀌어요. 시각을 고쳐서 넣고 싶으면 날짜를 눌러 ‘출근 기록 수정’을 써 주세요.</div><div class="list">`;
      fx.forEach(([id,f])=>{ html += `<div class="item"><div style="min-width:0"><div class="nm">${dLabel(f.date)} · ${esc(mName(f.mid))}</div><div class="faint" style="font-size:13px">출근 <span class="num">${esc(f.inHM)}</span>${f.outHM?` / 퇴근 <span class="num">${esc(f.outHM)}</span>`:""} · ${esc(f.note)}</div></div><div class="acts"><button class="btn small ghost danger" data-fix="no" data-id="${id}">거절</button><button class="btn small primary" data-fix="yes" data-id="${id}">승인</button></div></div>`; });
      html += `</div></section>`;
    } }
  html += `<section><div class="spread"><h2>매니저</h2><button class="btn small" data-act="mgr-new">+ 매니저 등록</button></div><div class="list">`;
  Object.entries(S.managers).sort((a,b)=>(a[1].order??0)-(b[1].order??0)).forEach(([id,m])=>{
    if (m.role==="owner"){ html += `<div class="item"><div style="min-width:0"><div class="nm">${esc(m.name)} <span class="pill s-accent">점주</span></div><div class="faint" style="font-size:13px">정해진 요일 없음 · 매니저 결원 시 대신 청소 · 점주 PIN으로 출근</div></div></div>`; return; }
    html += `<div class="item"><div style="min-width:0"><div class="nm">${esc(m.name)} ${m.active===false?`<span class="pill s-off">비활성</span>`:""} ${m.hasPin?"":`<span class="pill s-bad">PIN 없음</span>`}</div><div class="faint" style="font-size:13px">${m.duty==="evening"?"저녁 분리수거 · ":"오전 청소 · "}${(m.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DOW[d]).join("·")||"요일 미지정"} · ${m.payTo&&S.managers[m.payTo]?`급여 → ${esc(S.managers[m.payTo].name)}`:`<span class="num">${won(m.wage)}</span>/시간`}${m.startDate?` · <span class="num">${esc(m.startDate.slice(5).replace("-","/"))}</span> 시작`:""}</div></div><div class="acts"><button class="btn small ghost" data-act="mgr-edit" data-id="${id}">수정</button></div></div>`;
  });
  html += `</div></section>`;

  const monthBuys = S.purchases.filter(p=>(p.date||"").startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = monthBuys.reduce((s,p)=>s+(Number(p.price)||0),0);

/* clock in with live photo */
function startClockIn(){
  if (needLogin()) return;
  const cam = document.getElementById("cam"); cam.value = ""; cam.click();
}
document.getElementById("cam").addEventListener("change", async e=>{
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const now = Date.now();
  if (!file.type.startsWith("image/")){toast("사진 파일만 사용할 수 있어요.");return;}
  if (file.lastModified && now - file.lastModified > PHOTO_MAX_AGE_MS){
    openSheet(`<h3>방금 찍은 사진이 아니에요</h3><div class="muted">출근 인증은 지금 매장에서 바로 찍은 사진만 받아요. 다시 촬영해 주세요.</div><div class="acts"><button class="btn" data-close>닫기</button><button class="btn primary" id="retake">다시 촬영</button></div>`, sh=>sh.querySelector("#retake").addEventListener("click",()=>{document.getElementById("sheetRoot").innerHTML="";startClockIn();}));
    return;
  }
  let dataUrl;
  try{ dataUrl = await shrink(file); }catch(err){ toast("사진을 읽지 못했어요. 다시 촬영해 주세요."); return; }
  const t = seoul(new Date(now));
  const late = t.hm > ON_TIME_LIMIT;
  openSheet(`<h3>이 사진으로 출근할까요?</h3><img class="photo-thumb" src="${dataUrl}" alt="방금 찍은 매장 사진"><div class="spread"><div>지금 시각 <b class="num">${t.hm}</b></div><span class="pill ${late?"s-warn":"s-good"}">${late?"지각":"출근"}</span></div><div class="faint" style="font-size:12.5px">출근 시각은 서버 시간으로 기록돼요.</div><div id="cinerr"></div><div class="acts"><button class="btn" id="retake">다시 촬영</button><button class="btn primary" id="confirm">출근 기록</button></div>`, sh=>{
    sh.querySelector("#retake").addEventListener("click",()=>{document.getElementById("sheetRoot").innerHTML="";startClockIn();});
    const btn = sh.querySelector("#confirm");
    btn.addEventListener("click", async()=>{
      busyBtn(btn, "올리는 중…");
      const errBox = sh.querySelector("#cinerr"); errBox.innerHTML = "";
      try{
        let r = null, last = null;
        for (let i = 0; i < 3 && !r; i++){
          try { r = await call("clockIn",{photo:dataUrl, shotAt:now, mid:S.me}); }
          catch(e2){
            last = e2; const m = errMsg(e2);
            if (i > 0 && /이미 있어요/.test(m)) { r = { inHM: "" }; break; }      // 앞선 시도가 사실은 저장됐던 경우
            if (!/인터넷 연결|처리하지 못했어요|서버 오류/.test(m)) throw e2;    // 연결 문제가 아니면 바로 알림
            if (i === 2) break;
            btn.textContent = `다시 보내는 중… (${i+2}/3)`;
            await new Promise(ok=>setTimeout(ok, 1500*(i+1)));
          }
        }
        if (!r) throw last;
        S.photos[attKey(seoul().date, S.me)] = dataUrl;
        document.getElementById("sheetRoot").innerHTML="";
        toast(r.inHM ? `${r.inHM} 출근이 기록됐어요` : "출근이 기록됐어요"); await refresh();
      }catch(err){
        freeBtn(btn); btn.textContent = "다시 보내기";
        errBox.innerHTML = `<div class="note" style="border-left:3px solid var(--bad);margin-top:10px"><b>⚠️ 아직 출근이 기록되지 않았어요</b><br>${esc(errMsg(err))}<br><span class="faint" style="font-size:12.5px">와이파이가 불안하면 끄고 LTE로 바꾼 뒤 ‘다시 보내기’를 눌러 주세요. 계속 안 되면 날짜를 눌러 ‘출근 기록 정정 요청’을 보내 주세요.</span></div>`;
      }
    });
  });
});
function shrink(file){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1280, k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror = ()=>{URL.revokeObjectURL(u);rej(new Error("img"));};
    img.src = u;
  });
}

  if (r?.memo) h += `<dt>메모</dt><dd>${esc(r.memo)}</dd>`;
  if (r?.fixedAt) h += `<dt>수정</dt><dd><span class="pill s-accent">${esc(r.fixedBy||"점주")} 수정</span>${r.fixNote?` <span class="faint">${esc(r.fixNote)}</span>`:""}</dd>`;
  if (!S.isOwner) eveningFor(date).forEach(([id,m])=>{ const er = eveRec(date,id), sub = eveSub(date,id); h += `<dt>저녁</dt><dd>${esc(m.name)} 분리수거 · ${eveCovered(er,id)?`${esc(er.byName||mName(er.by))} 대신 처리 <span class="num">${esc(er.hm)}</span>`:er?`완료 <span class="num">${esc(er.hm)}</span>`:sub?`${esc(mName(sub))} 대타 ${date < today ? "· 완료 기록 없음" : "예정"}`:(date < today ? "완료 기록 없음" : "예정")}</dd>`; });
  h += `</dl>`;
  if (S.isOwner && eveningFor(date).length) h += `<div class="list">${eveOwnerControls(date)}</div>`;
  const evs = eventsFor(date), sts = startsOn(date);
  if (evs.length || sts.length) h += `<div class="list">${evs.map(([id,e])=>`<div class="item"><div class="nm">${esc(e.title)}${e.time?` <span class="faint num">${esc(e.time)}</span>`:""}</div><div class="acts">${S.isOwner?`<button class="btn small ghost danger" data-evdel="${id}">삭제</button>`:""}</div></div>`).join("")}${sts.map(([,m])=>`<div class="item"><div class="nm">${esc(m.name)} 매니저 첫 출근</div></div>`).join("")}</div>`;
  { const cs = checkCount(date); if (cs.total && (cs.done || date <= today)) h += `<details class="cl"><summary>청소 체크리스트 ${cs.done}/${cs.total} 완료</summary>${checklistHtml(date, false, false)}</details>`; }
  if (r?.hasPhoto) h += photoSlot(attKey(date,mid), `${mName(mid)} 출근 사진, ${r.inHM} 촬영`);
  { const sr = swapRowsFor(date); if (sr) h += `<div class="list">${sr}</div>`; }
  { const fr = fixRowsFor(date); if (fr) h += `<div class="list">${fr}</div>`; }
  if (!S.isOwner && S.pin && date <= today && daysAgo(date) <= 14 && (info.mid===S.me || recFor(date, S.me)) && !fixPending(date, S.me)) h += `<div class="acts" style="justify-content:flex-start"><button class="btn" id="fix-req">출근 기록 정정 요청</button></div>`;
  if (S.isOwner && date <= today) h += `<div class="acts" style="justify-content:flex-start"><button class="btn" id="att-edit">출근 기록 수정</button></div>`;
  const myEve = !S.isOwner && S.pin && eveningFor(date).some(([id])=>id===S.me);
  const future = date >= today;
  if (!S.isOwner && S.pin && future && info.mid===S.me && !info.pending.length) h += `<div class="acts" style="justify-content:flex-start"><button class="btn" id="req-swap">대타 요청</button></div>`;
  if (myEve && future && !evePending(date, S.me).length && !eveRec(date, S.me)) h += `<div class="acts" style="justify-content:flex-start"><button class="btn" id="req-eswap">${eveSub(date,S.me)?"분리수거 대타 다시 요청":"분리수거 대타 요청"}</button></div>`;
  if (S.isOwner){
    h += `<div class="field"><label for="evt">매장 일정 추가 (점주)</label><div class="row"><input id="evt" placeholder="예: 전체 OT" style="flex:2;min-width:140px"><input id="evtime" placeholder="시간 (선택)" style="flex:1;min-width:90px"><button class="btn" id="evadd" type="button">추가</button></div></div>`;
    if (mid) h += `<div class="field"><label for="ovr">상태 직접 지정 (점주)</label><select id="ovr"><option value="">자동 판정</option>${["출근","지각","결근"].map(o=>`<option ${r?.statusOverride===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
    if (future) h += `<div class="acts" style="justify-content:flex-start"><button class="btn" id="own-swap">담당자 바꾸기</button>${eveningFor(date).map(([id,m])=>`<button class="btn" data-own-eswap="${id}">${esc(m.name)} 분리수거 대타 지정</button>`).join("")}</div>`;
  }
  h += `<div class="acts"><button class="btn primary" data-close>닫기</button></div>`;
  openSheet(h, sh=>{
    sh.querySelector("#req-swap")?.addEventListener("click",()=>changeSheet(date,mid,false));
    sh.querySelector("#own-swap")?.addEventListener("click",()=>changeSheet(date,mid||info.baseId,true));
    sh.querySelector("#att-edit")?.addEventListener("click",()=>attEditSheet(date, mid||info.baseId));
    sh.querySelector("#fix-req")?.addEventListener("click",()=>fixReqSheet(date));
    bindFix(sh, closeSheet);
    sh.querySelector("#req-eswap")?.addEventListener("click",()=>changeSheet(date,S.me,false,"eswap"));
    sh.querySelectorAll("[data-own-eswap]").forEach(b=>b.addEventListener("click",()=>changeSheet(date,b.dataset.ownEswap,true,"eswap")));
    sh.querySelectorAll("[data-act=photo]").forEach(b=>b.addEventListener("click",()=>loadPhoto(b.dataset.key, b)));
    sh.querySelector("#evadd")?.addEventListener("click", async ev=>{
      const title = sh.querySelector("#evt").value.trim(); if (!title){toast("일정 이름을 입력해 주세요.");return;}
      busyBtn(ev.target);
      const ok = await act(()=>call("eventSave",{date, title, time:sh.querySelector("#evtime").value.trim()}), "일정을 추가했어요");
      if (ok) closeSheet(); else freeBtn(ev.target);
    });
    sh.querySelectorAll("[data-evdel]").forEach(b=>b.addEventListener("click", async()=>{
      if (!b.dataset.armed){b.dataset.armed="1";b.textContent="한 번 더";return;}
      const ok = await act(()=>call("eventDelete",{id:b.dataset.evdel}), "일정을 지웠어요");
      if (ok) closeSheet();
    }));
    sh.querySelector("#ovr")?.addEventListener("change", ev=>act(()=>call("override",{date, mid, value:ev.target.value}), "상태를 바꿨어요"));
    bindEveOwn(sh, closeSheet);
    bindSwap(sh, closeSheet);
  });
}

/* ---------- 소통 게시판 ---------- */
const KIND = {notice:["공지","s-accent"], issue:["이슈","s-warn"], talk:["일반","s-plan"]};
function whenLabel(iso){ if (!iso) return ""; const d = new Date(iso), t = seoul(d), today = seoul().date; const [,mm,dd] = t.date.split("-"); return t.date===today ? t.hm : `${Number(mm)}/${Number(dd)} ${t.hm}`; }
function boardSeenKey(){ return "boardSeen."+(S.me||"x"); }
function boardUnread(){
  if (!S.board || !S.me) return 0;
  const seen = store.get(boardSeenKey()) || "";
  let n = 0;
  S.board.posts.forEach(p=>{ if (p.mid!==S.me && p.at > seen) n++; });
  S.board.comments.forEach(c=>{ if (c.mid!==S.me && c.at > seen) n++; });
  return n;

function markBoardSeen(){

/* ---------- 휴대폰 알림 (웹 푸시) ---------- */
const PUSH_KEY = "BHijnUAeUENIzctMJ8Etigl1y6rkV6Z3pr-xy83MNiDX78C_EtYFDB8r1SGImuGN6ijRH85CulElWFCEhMh1R6o";
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function b64uBytes(s){ const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b, c=>c.charCodeAt(0)); }
function pushCard(){

}
async function pushEnable(btn){
  try{
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ toast("알림을 ‘허용’해야 받을 수 있어요."); render(); return; }
    busyBtn(btn);
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64uBytes(PUSH_KEY) });
    await call("pushSubscribe", { sub: sub.toJSON(), welcome: true });
    S.pushSub = sub; S.pushOn = true; S._pushSynced = myId();
    toast("알림을 켰어요. 확인 알림을 보냈어요"); render();
  }catch(e){ freeBtn(btn); toast(errMsg(e)); }
}
async function pushSync(){
  try{
    const me = myId();
    if (!me || !(S.pin || S.isOwner) || !pushSupported() || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    const was = S.pushOn;
    S.pushSub = sub; S.pushOn = !!sub;
    if (sub && S._pushSynced !== me){ S._pushSynced = me; await call("pushSubscribe", { sub: sub.toJSON() }); }
    if (was !== S.pushOn && S.tab === "today" && !document.querySelector(".scrim")) render();
  }catch(e){ console.warn("push sync", e); }
}

      const inHM = sh.querySelector("#fin").value, outHM = sh.querySelector("#fout").value;
      if (!inHM && outHM){ toast("출근 시각도 넣어 주세요."); return; }
      busyBtn(go);
      const ok = await act(()=>call("attEdit",{date, mid:sh.querySelector("#fm").value, inHM, outHM, note:sh.querySelector("#fnote").value.trim()}), "출근 기록을 고쳤어요");
      if (ok) closeSheet(); else freeBtn(go);
    });
  });
}
function fixReqSheet(date){
  const r = recFor(date, S.me) || {};
  openSheet(`<h3>${dLabel(date)} 출근 기록 정정 요청</h3>
    <div class="muted" style="font-size:14px">실제로 출근·퇴근한 시각을 적어 주세요. 점주가 승인하면 기록이 바뀌어요.</div>
    ${timeFields(r.inHM, r.outHM)}
    <div class="field"><label for="fnote">무슨 일이 있었나요?</label><input id="fnote" placeholder="예: 사진까지 찍었는데 와이파이 문제로 등록이 안 됐어요"></div>
    <div class="acts"><button class="btn" data-close>취소</button><button class="btn primary" id="go">요청 보내기</button></div>`, sh=>{
    const go = sh.querySelector("#go");
    go.addEventListener("click", async()=>{
      const inHM = sh.querySelector("#fin").value, outHM = sh.querySelector("#fout").value, note = sh.querySelector("#fnote").value.trim();
      if (!inHM){ toast("실제 출근 시각을 넣어 주세요."); return; }
      if (!note){ toast("무슨 일이 있었는지 짧게 적어 주세요."); return; }
      busyBtn(go);
      const ok = await act(()=>call("attFixRequest",{date, inHM, outHM, note}), "정정 요청을 보냈어요. 점주가 승인하면 알려 드릴게요");
      if (ok) closeSheet(); else freeBtn(go);
    });
  });
}

S.me = store.get("me") || null; S.pin = store.get("pin"); S.ownerPin = store.get("ownerPin");
const t0 = store.get("tab"); if (t0) S.tab = t0;
{ const qt = new URLSearchParams(location.search).get("tab"); if (qt) S.tab = qt; }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw", e));
setInterval(()=>{ if (!document.querySelector(".scrim") && document.visibilityState==="visible") refresh(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") refresh(); });
render();
refresh();
(function live(){
  let t = null;
  const kick = () => { clearTimeout(t); t = setTimeout(()=>{ if (document.visibilityState==="visible") refresh(); }, 250); };
  try{
    if (!window.supabase) return;
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:false } });
    sb.channel("hongje-sync").on("broadcast", { event:"changed" }, kick).subscribe();
  }catch(e){ console.warn("live", e); }
})();
})();
